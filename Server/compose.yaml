# Docker services
services:

  # ===============================================================================================
  # PostgresSQL database
  # ===============================================================================================
  postgresql:
    image: postgres:latest
    ports:
      - "5432:5432"
    volumes:
      - ./PostgreSQL:/var/lib/postgresql
      - ./Database:/docker-entrypoint-initdb.d
    env_file: ".env"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: "30s"
      timeout: "30s"
      start_period: "60s"
      start_interval: "5s"
      retries: "3"

  # ===============================================================================================
  # Adminer database management
  # ===============================================================================================
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgresql
    depends_on:
      postgresql:
        condition: "service_healthy"

  # ===============================================================================================
  # Parker2 job scheduler
  # ===============================================================================================
  scheduler:
    build: .
    ports:
      - "8000:8000"
    env_file: ".env"
    depends_on:
      postgresql:
        condition: "service_healthy"